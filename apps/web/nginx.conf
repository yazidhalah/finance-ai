# The SPA and the /api proxy on one origin (SEC-63). TLS terminates in front of this (Caddy profile, or the
# operator's edge, SEC-60); this server speaks plain HTTP inside the compose network only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-61. The SPA has no inline scripts (Vite emits module scripts); Tailwind's CSS is a file.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS is only meaningful over TLS; the edge that terminates TLS adds it (SEC-60). Left here for edges that forward it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    location /api/ {
        set $api http://api:5080;    # a variable so nginx resolves it per request (see nginx-resolver.sh)
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 12m;      # CSV/XLSX imports and dispute evidence (10 MB cap in the API)
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
